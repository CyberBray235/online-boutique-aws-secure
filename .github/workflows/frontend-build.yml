name: Build and Push Frontend to ECR

on:
  push:
    branches:
      - main
    paths:
      - 'microservices-demo/src/frontend/**'
      - 'online-boutique-aws-secure/k8s/overlays/dev/app/**'
      - '.github/workflows/frontend-build.yml'
  workflow_dispatch:

env:
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REPOSITORY: online-boutique-aws-dev-online_boutique

jobs:
  build-and-push:
    name: Build and Push Frontend Image
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build, tag and push frontend image
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: frontend-${{ github.sha }}
        run: |
          cd microservices-demo/src/frontend
          docker build -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG .
          docker tag $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG $ECR_REGISTRY/$ECR_REPOSITORY:frontend-latest
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:frontend-latest

      - name: Install Kustomize
        run: |
          curl -sSL https://github.com/kubernetes-sigs/kustomize/releases/latest/download/kustomize_linux_amd64 -o kustomize
          chmod +x kustomize
          sudo mv kustomize /usr/local/bin/kustomize

      - name: Update Kustomize image tag
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: frontend-${{ github.sha }}
        run: |
          cd online-boutique-aws-secure/k8s/overlays/dev/app
          kustomize edit set image frontend=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          cat kustomization.yaml

      - name: Commit and push manifest update
        env:
          IMAGE_TAG: frontend-${{ github.sha }}
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add online-boutique-aws-secure/k8s/overlays/dev/app/kustomization.yaml
          git commit -m "deploy(frontend): update image to $IMAGE_TAG [skip ci]" || echo "No changes to commit"
          git push